<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ea580c">
  <title>Sign In | student-os.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.2">
</head>
<body data-page="login" class="login-page">
  <div class="grain"></div>
  
  <div class="login-container">
    <div class="login-header">
      <div class="brand-mark orange-mark">S</div>
      <h2>student-os<span>.com</span></h2>
      <p>Sign in to manage students, groups, and enrollment records securely.</p>
    </div>

    <div class="login-card">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-orange-submit" id="loginSubmitBtn">
          <span>Sign In to student-os.com</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14 0m-5-5 5 5-5 5"/></svg>
        </button>

        <p class="login-error" id="loginError" role="alert"></p>

        <a class="login-secondary-link" href="signup.html">Need an account? Request access</a>

      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"><span>✓</span><p><b id="toastTitle">Logged In</b><small id="toastMsg">Welcome back to student-os.com.</small></p></div>

  <script src="script.js?v=3.2"></script>
</body>
</html>
