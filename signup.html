<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ea580c">
  <title>Request an Account | student-os.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.2">
</head>
<body data-page="signup" class="login-page">
  <div class="login-container signup-container">
    <div class="login-header">
      <div class="brand-mark orange-mark">S</div>
      <h2>Request <span>Access</span></h2>
      <p>Create your account request. An administrator must approve it before you can sign in.</p>
    </div>
    <div class="login-card">
      <form id="signupForm">
        <div class="form-group"><label for="signupFullName">Full name</label><input id="signupFullName" name="fullName" required autocomplete="name" placeholder="Enter your full name"></div>
        <div class="form-group"><label for="signupUsername">Username</label><input id="signupUsername" name="username" required minlength="3" autocomplete="username" placeholder="Choose a username"></div>
        <div class="form-group"><label for="signupSection">Academic section</label><select id="signupSection" name="section" required><option value="mispce" selected>MISPCE (Math, Informatics, Stats, Physics, Chemistry, Electronics)</option><option value="csvt">CSVT (Biology, Biochemistry, Chemistry)</option></select></div>
        <div class="form-group"><label for="signupPassword">Password</label><input id="signupPassword" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters"></div>
        <div class="form-group"><label for="signupConfirmPassword">Confirm password</label><input id="signupConfirmPassword" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat your password"></div>
        <button type="submit" class="btn-orange-submit" id="signupSubmitBtn"><span>Send approval request</span></button>
        <p class="login-error" id="signupMessage" role="status"></p>
        <a class="login-secondary-link" href="login.html">Already approved? Sign in</a>
      </form>
    </div>
  </div>
  <script src="script.js?v=3.2"></script>
</body>
</html>
